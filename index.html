<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>スマ庫</title>
<script src="site-config.js"></script>
<style>
  :root {
    --red: #d10a1e;
    --red-dark: #a30716;
    --red-soft: #ff3b4e;
    --bg: #14100f;
    --bg-card: #211a19;
    --text: #f5eeee;
    --text-dim: #b9a9a9;
    --border: #3a2b2b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", system-ui, sans-serif;
    min-height: 100vh;
  }

  /* ===== 合言葉ゲート ===== */
  #gate {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 30%, #2a1113, var(--bg) 70%);
    padding: 20px;
  }
  .gate-card {
    width: 100%; max-width: 380px; text-align: center;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-top: 5px solid var(--red);
    border-radius: 16px;
    padding: 40px 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  .logo {
    font-size: 44px; font-weight: 900; letter-spacing: 4px;
    color: var(--red-soft);
    text-shadow: 0 0 18px rgba(209,10,30,.6);
    margin: 0 0 6px;
  }
  .tagline { color: var(--text-dim); font-size: 13px; margin: 0 0 28px; }
  #gate input {
    width: 100%; padding: 14px 16px; font-size: 16px;
    background: #170f0f; color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    text-align: center; margin-bottom: 14px;
  }
  #gate input:focus { outline: none; border-color: var(--red); }
  .btn {
    width: 100%; padding: 14px; font-size: 16px; font-weight: 700;
    color: #fff; background: var(--red); border: none; border-radius: 10px;
    cursor: pointer; transition: background .15s;
  }
  .btn:hover { background: var(--red-dark); }
  #gate-error { color: var(--red-soft); font-size: 13px; height: 18px; margin-top: 12px; }

  /* ===== 本体 ===== */
  #app { display: none; }
  header.top {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 14px;
    padding: 14px 20px;
    background: linear-gradient(180deg, #1c1413, rgba(28,20,19,.92));
    border-bottom: 2px solid var(--red);
    backdrop-filter: blur(6px);
  }
  header.top .brand { font-size: 24px; font-weight: 900; letter-spacing: 2px; color: var(--red-soft); }
  header.top .count { color: var(--text-dim); font-size: 13px; }
  header.top .spacer { flex: 1; }
  .search {
    padding: 8px 12px; font-size: 14px; width: 220px; max-width: 40vw;
    background: #170f0f; color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
  }
  .search:focus { outline: none; border-color: var(--red); }
  .lockbtn {
    background: transparent; color: var(--text-dim);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 12px; cursor: pointer; font-size: 13px;
  }
  .lockbtn:hover { color: #fff; border-color: var(--red); }

  main { max-width: 1200px; margin: 0 auto; padding: 24px 20px 80px; }
  .grid {
    display: grid; gap: 18px;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  }
  .card {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden; cursor: pointer;
    transition: transform .12s, border-color .12s;
  }
  .card:hover { transform: translateY(-3px); border-color: var(--red); }
  .thumb { position: relative; aspect-ratio: 16/9; background: #000; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .play {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,.15); opacity: 0; transition: opacity .12s;
  }
  .card:hover .play { opacity: 1; }
  .play span {
    width: 54px; height: 54px; border-radius: 50%;
    background: var(--red); display: flex; align-items: center; justify-content: center;
  }
  .play span::after { content: ""; border-left: 18px solid #fff; border-top: 11px solid transparent; border-bottom: 11px solid transparent; margin-left: 4px; }
  .card .meta { padding: 12px 14px; }
  .card .title { font-size: 14px; font-weight: 600; line-height: 1.4; margin: 0 0 6px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .sub { font-size: 12px; color: var(--text-dim); }
  .badge {
    position: absolute; top: 8px; left: 8px; z-index: 2;
    font-size: 11px; font-weight: 700; letter-spacing: .5px;
    padding: 3px 8px; border-radius: 6px; color: #fff;
  }
  .badge.youtube { background: #cc0000; }
  .badge.twitch { background: #9146ff; }

  .empty { text-align: center; color: var(--text-dim); padding: 80px 20px; line-height: 1.9; }
  .empty .big { font-size: 20px; color: var(--text); margin-bottom: 8px; }

  /* モーダル再生 */
  #modal {
    position: fixed; inset: 0; z-index: 50; display: none;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,.85); padding: 20px;
  }
  #modal .box { width: 100%; max-width: 900px; }
  #modal .player { position: relative; aspect-ratio: 16/9; background: #000; border-radius: 10px; overflow: hidden; }
  #modal iframe { width: 100%; height: 100%; border: 0; }
  #modal .close { margin-top: 12px; }
  footer { text-align: center; color: var(--text-dim); font-size: 12px; padding: 20px; }
</style>
</head>
<body>

  <!-- 合言葉ゲート -->
  <div id="gate">
    <div class="gate-card">
      <div class="logo">スマ庫</div>
      <p class="tagline">合言葉を入力してください</p>
      <input id="pass" type="password" placeholder="合言葉" autocomplete="off" autofocus>
      <button class="btn" id="enter">入場する</button>
      <div id="gate-error"></div>
    </div>
  </div>

  <!-- 本体 -->
  <div id="app">
    <header class="top">
      <span class="brand">スマ庫</span>
      <span class="count" id="count"></span>
      <span class="spacer"></span>
      <input class="search" id="search" type="text" placeholder="タイトル検索…">
      <button class="lockbtn" id="lock">ロック</button>
    </header>
    <main>
      <div class="grid" id="grid"></div>
      <div class="empty" id="empty" style="display:none">
        <div class="big">まだ動画がありません</div>
        指定チャンネルの自動収集が動くと、ここに動画が並びます。
      </div>
    </main>
    <footer>スマ庫 — 大乱闘スマッシュブラザーズ 動画アーカイブ</footer>
  </div>

  <!-- 再生モーダル -->
  <div id="modal">
    <div class="box">
      <div class="player" id="player"></div>
      <button class="btn close" id="close">閉じる</button>
    </div>
  </div>

<script>
const CFG = window.SUMAKO_CONFIG;
const UNLOCK_KEY = "sumako_unlocked";

async function sha256(text) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}

// ===== ゲート処理 =====
const gate = document.getElementById("gate");
const app = document.getElementById("app");
const passInput = document.getElementById("pass");
const gateError = document.getElementById("gate-error");

async function tryEnter() {
  const val = passInput.value.trim();
  if (!val) return;
  const h = await sha256(val);
  if (h === CFG.PASSPHRASE_HASH) {
    sessionStorage.setItem(UNLOCK_KEY, "1");
    openApp();
  } else {
    gateError.textContent = "合言葉が違います";
    passInput.value = "";
    passInput.focus();
  }
}
document.getElementById("enter").addEventListener("click", tryEnter);
passInput.addEventListener("keydown", e => { if (e.key === "Enter") tryEnter(); });

document.getElementById("lock").addEventListener("click", () => {
  sessionStorage.removeItem(UNLOCK_KEY);
  location.reload();
});

function openApp() {
  gate.style.display = "none";
  app.style.display = "block";
  loadVideos();
}

// セッション中はロックを覚えておく
if (sessionStorage.getItem(UNLOCK_KEY) === "1") openApp();

// ===== 動画一覧 =====
let allVideos = [];
const grid = document.getElementById("grid");
const emptyBox = document.getElementById("empty");
const countEl = document.getElementById("count");

async function loadVideos() {
  try {
    const res = await fetch("videos.json?_=" + Date.now());
    allVideos = await res.json();
  } catch (e) {
    allVideos = [];
  }
  render(allVideos);
}

function render(list) {
  countEl.textContent = allVideos.length ? allVideos.length + " 本" : "";
  grid.innerHTML = "";
  // 動画が1本もない(自動収集前)ときだけ案内を表示
  emptyBox.style.display = allVideos.length === 0 ? "block" : "none";
  for (const v of list) {
    const card = document.createElement("div");
    card.className = "card";
    const src = v.source === "twitch" ? "twitch" : "youtube";
    const label = src === "twitch" ? "Twitch" : "YouTube";
    card.innerHTML = `
      <div class="thumb">
        <span class="badge ${src}">${label}</span>
        <img loading="lazy" src="${escapeHtml(v.thumb || "")}" alt="">
        <div class="play"><span></span></div>
      </div>
      <div class="meta">
        <p class="title">${escapeHtml(v.title)}</p>
        <div class="sub">${escapeHtml(v.author || "")}${v.published ? " ・ " + v.published.slice(0,10) : ""}</div>
      </div>`;
    card.addEventListener("click", () => play(v));
    grid.appendChild(card);
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

// ===== 検索 =====
document.getElementById("search").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase();
  render(q ? allVideos.filter(v => (v.title || "").toLowerCase().includes(q)) : allVideos);
});

// ===== 再生モーダル =====
const modal = document.getElementById("modal");
const player = document.getElementById("player");
function play(v) {
  let src;
  if (v.source === "twitch") {
    // Twitchは埋め込みに表示元ドメイン(parent)の指定が必須
    src = `https://player.twitch.tv/?video=${encodeURIComponent(v.id)}&parent=${location.hostname}&autoplay=true`;
  } else {
    src = `https://www.youtube.com/embed/${encodeURIComponent(v.id)}?autoplay=1`;
  }
  player.innerHTML = `<iframe src="${src}" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
  modal.style.display = "flex";
}
function closeModal() { modal.style.display = "none"; player.innerHTML = ""; }
document.getElementById("close").addEventListener("click", closeModal);
modal.addEventListener("click", e => { if (e.target === modal) closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
</script>
</body>
</html>
