<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>スマ庫</title>
<script src="site-config.js"></script>
<style>
  :root {
    --red: #d10a1e;
    --red-dark: #a30716;
    --red-soft: #ff3b4e;
    --bg: #14100f;
    --bg-card: #211a19;
    --bg-side: #1a1211;
    --text: #f5eeee;
    --text-dim: #b9a9a9;
    --border: #3a2b2b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", system-ui, sans-serif;
    min-height: 100vh;
  }

  /* ===== 合言葉ゲート ===== */
  #gate {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 30%, #2a1113, var(--bg) 70%); padding: 20px;
  }
  .gate-card {
    width: 100%; max-width: 380px; text-align: center;
    background: var(--bg-card); border: 1px solid var(--border); border-top: 5px solid var(--red);
    border-radius: 16px; padding: 40px 28px; box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  .logo { font-size: 44px; font-weight: 900; letter-spacing: 4px; color: var(--red-soft);
    text-shadow: 0 0 18px rgba(209,10,30,.6); margin: 0 0 6px; }
  .tagline { color: var(--text-dim); font-size: 13px; margin: 0 0 28px; }
  #gate input {
    width: 100%; padding: 14px 16px; font-size: 16px; background: #170f0f; color: var(--text);
    border: 1px solid var(--border); border-radius: 10px; text-align: center; margin-bottom: 14px;
  }
  #gate input:focus { outline: none; border-color: var(--red); }
  .btn {
    padding: 12px 16px; font-size: 15px; font-weight: 700; color: #fff; background: var(--red);
    border: none; border-radius: 10px; cursor: pointer; transition: background .15s;
  }
  .btn:hover { background: var(--red-dark); }
  .btn.block { width: 100%; }
  #gate-error { color: var(--red-soft); font-size: 13px; height: 18px; margin-top: 12px; }

  /* ===== レイアウト ===== */
  #app { display: none; }
  #app.on { display: flex; align-items: stretch; }

  aside.sidebar {
    flex: 0 0 210px; width: 210px; align-self: flex-start;
    position: sticky; top: 0; height: 100vh;
    background: var(--bg-side); border-right: 2px solid var(--red);
    display: flex; flex-direction: column; padding: 18px 14px; gap: 6px;
  }
  aside .brand { font-size: 26px; font-weight: 900; letter-spacing: 3px; color: var(--red-soft);
    padding: 4px 8px 16px; }
  aside .navbtn {
    display: flex; align-items: center; gap: 10px; text-align: left;
    padding: 12px 14px; font-size: 15px; font-weight: 600; color: var(--text-dim);
    background: transparent; border: 1px solid transparent; border-radius: 10px; cursor: pointer;
  }
  aside .navbtn:hover { color: #fff; background: #241b1a; }
  aside .navbtn.active { color: #fff; background: var(--red); }
  aside .navbtn .ico { font-size: 18px; }
  aside .spacer { flex: 1; }
  aside .lockbtn { color: var(--text-dim); background: transparent; border: 1px solid var(--border);
    border-radius: 10px; padding: 10px; cursor: pointer; font-size: 13px; }
  aside .lockbtn:hover { color: #fff; border-color: var(--red); }

  .content { flex: 1; min-width: 0; }
  .view { display: none; }
  .view.on { display: block; }

  /* ===== アーカイブ ===== */
  .archive-bar {
    position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 12px;
    padding: 14px 20px; background: rgba(28,20,19,.92); backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--border);
  }
  .archive-bar .h { font-size: 18px; font-weight: 800; }
  .archive-bar .count { color: var(--text-dim); font-size: 13px; }
  .archive-bar .spacer { flex: 1; }
  .search { padding: 8px 12px; font-size: 14px; width: 240px; max-width: 45vw;
    background: #170f0f; color: var(--text); border: 1px solid var(--border); border-radius: 8px; }
  .search:focus { outline: none; border-color: var(--red); }

  nav.tabs {
    position: sticky; top: 51px; z-index: 9; display: flex; gap: 8px; overflow-x: auto; white-space: nowrap;
    padding: 10px 20px; background: var(--bg-side); border-bottom: 1px solid var(--border);
  }
  nav.tabs button {
    flex: 0 0 auto; padding: 7px 14px; font-size: 13px; font-weight: 600; color: var(--text-dim);
    background: #241b1a; border: 1px solid var(--border); border-radius: 999px; cursor: pointer;
  }
  nav.tabs button:hover { color: #fff; border-color: var(--red-soft); }
  nav.tabs button.active { color: #fff; background: var(--red); border-color: var(--red); }
  nav.tabs button .n { opacity: .7; font-weight: 400; margin-left: 4px; font-size: 11px; }

  .grid { display: grid; gap: 18px; padding: 24px 20px 80px;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
    overflow: hidden; cursor: pointer; transition: transform .12s, border-color .12s; }
  .card:hover { transform: translateY(-3px); border-color: var(--red); }
  .thumb { position: relative; aspect-ratio: 16/9; background: #000; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .badge { position: absolute; top: 8px; left: 8px; z-index: 2; font-size: 11px; font-weight: 700;
    letter-spacing: .5px; padding: 3px 8px; border-radius: 6px; color: #fff; }
  .badge.youtube { background: #cc0000; }
  .badge.twitch { background: #9146ff; }
  .play { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,.15); opacity: 0; transition: opacity .12s; }
  .card:hover .play { opacity: 1; }
  .play span { width: 54px; height: 54px; border-radius: 50%; background: var(--red);
    display: flex; align-items: center; justify-content: center; }
  .play span::after { content: ""; border-left: 18px solid #fff; border-top: 11px solid transparent;
    border-bottom: 11px solid transparent; margin-left: 4px; }
  .card .meta { padding: 12px 14px; }
  .card .title { font-size: 14px; font-weight: 600; line-height: 1.4; margin: 0 0 6px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .sub { font-size: 12px; color: var(--text-dim); }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .chip { font-size: 10px; padding: 2px 7px; border-radius: 999px;
    background: rgba(209,10,30,.15); color: var(--red-soft); border: 1px solid rgba(209,10,30,.35); }
  .empty { text-align: center; color: var(--text-dim); padding: 80px 20px; line-height: 1.9; }
  .empty .big { font-size: 20px; color: var(--text); margin-bottom: 8px; }

  /* ===== メモ ===== */
  .notes-head { padding: 20px 24px 0; }
  .notes-head h2 { margin: 0 0 4px; font-size: 20px; }
  .notes-head p { margin: 0; color: var(--text-dim); font-size: 12px; }
  nav.subtabs { display: flex; gap: 8px; flex-wrap: wrap; padding: 16px 24px 0; }
  nav.subtabs button {
    padding: 8px 16px; font-size: 14px; font-weight: 600; color: var(--text-dim);
    background: #241b1a; border: 1px solid var(--border); border-radius: 10px 10px 0 0; cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  nav.subtabs button.active { color: #fff; background: var(--bg-card); border-color: var(--border);
    border-bottom-color: var(--red); }
  .notes-tools { display: flex; gap: 8px; align-items: center; padding: 14px 24px; flex-wrap: wrap; }
  .notes-tools .spacer { flex: 1; }
  .minibtn { padding: 8px 14px; font-size: 13px; font-weight: 600; color: var(--text);
    background: #241b1a; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; }
  .minibtn:hover { border-color: var(--red-soft); }
  .notes-list { padding: 0 24px 80px; display: flex; flex-direction: column; gap: 14px; }
  .note {
    background: var(--bg-card); border: 1px solid var(--border); border-left: 4px solid var(--red);
    border-radius: 10px; padding: 14px 16px;
  }
  .note input.note-title {
    width: 100%; font-size: 16px; font-weight: 700; color: var(--text); background: transparent;
    border: none; border-bottom: 1px solid var(--border); padding: 4px 2px 8px; margin-bottom: 10px;
  }
  .note input.note-title:focus { outline: none; border-bottom-color: var(--red); }
  .note textarea {
    width: 100%; min-height: 90px; resize: vertical; font-size: 14px; line-height: 1.7;
    color: var(--text); background: #170f0f; border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; font-family: inherit;
  }
  .note textarea:focus { outline: none; border-color: var(--red); }
  .note .row { display: flex; justify-content: flex-end; margin-top: 8px; }
  .note .del { color: var(--text-dim); background: transparent; border: none; cursor: pointer; font-size: 12px; }
  .note .del:hover { color: var(--red-soft); }
  .notes-empty { color: var(--text-dim); padding: 40px 24px; font-size: 14px; }

  /* 再生モーダル */
  #modal { position: fixed; inset: 0; z-index: 50; display: none; align-items: center;
    justify-content: center; background: rgba(0,0,0,.85); padding: 20px; }
  #modal .box { width: 100%; max-width: 900px; }
  #modal .player { position: relative; aspect-ratio: 16/9; background: #000; border-radius: 10px; overflow: hidden; }
  #modal iframe { width: 100%; height: 100%; border: 0; }
  #modal .close { margin-top: 12px; }

  @media (max-width: 720px) {
    #app.on { flex-direction: column; }
    aside.sidebar { position: sticky; top: 0; width: auto; height: auto; flex: none;
      flex-direction: row; align-items: center; border-right: none; border-bottom: 2px solid var(--red);
      overflow-x: auto; z-index: 20; }
    aside .brand { padding: 4px 10px; font-size: 20px; }
    aside .spacer { flex: 0; }
    .search { width: 150px; }
  }
</style>
</head>
<body>

  <!-- 合言葉ゲート -->
  <div id="gate">
    <div class="gate-card">
      <div class="logo">スマ庫</div>
      <p class="tagline">合言葉を入力してください</p>
      <input id="pass" type="password" placeholder="合言葉" autocomplete="off" autofocus>
      <button class="btn block" id="enter">入場する</button>
      <div id="gate-error"></div>
    </div>
  </div>

  <!-- 本体 -->
  <div id="app">
    <aside class="sidebar">
      <div class="brand">スマ庫</div>
      <button class="navbtn active" data-view="archive"><span class="ico">📼</span> アーカイブ</button>
      <button class="navbtn" data-view="notes"><span class="ico">📝</span> メモ</button>
      <div class="spacer"></div>
      <button class="lockbtn" id="lock">🔒 ロック</button>
    </aside>

    <div class="content">
      <!-- アーカイブ -->
      <section class="view on" id="view-archive">
        <div class="archive-bar">
          <span class="h">動画アーカイブ</span>
          <span class="count" id="count"></span>
          <span class="spacer"></span>
          <input class="search" id="search" type="text" placeholder="タイトル検索…">
        </div>
        <nav class="tabs" id="tabs"></nav>
        <div class="grid" id="grid"></div>
        <div class="empty" id="empty" style="display:none">
          <div class="big">まだ動画がありません</div>
          自動収集が動くと、ここに動画が並びます。
        </div>
      </section>

      <!-- メモ -->
      <section class="view" id="view-notes">
        <div class="notes-head">
          <h2 id="notes-title">各種技メモ</h2>
          <p>ドクターマリオの研究ノート（この端末のブラウザに自動保存されます）</p>
        </div>
        <nav class="subtabs" id="subtabs">
          <button class="active" data-cat="tech">各種技メモ</button>
          <button data-cat="aware">試合中の意識</button>
          <button data-cat="combo">コンボルート整理</button>
        </nav>
        <div class="notes-tools">
          <button class="btn" id="add-note">＋ ノートを追加</button>
          <span class="spacer"></span>
          <button class="minibtn" id="export-notes">書き出し(バックアップ)</button>
          <button class="minibtn" id="import-notes">読み込み</button>
          <input type="file" id="import-file" accept="application/json" hidden>
        </div>
        <div class="notes-list" id="notes-list"></div>
        <div class="notes-empty" id="notes-empty" hidden>まだノートがありません。「＋ ノートを追加」から書き始めましょう。</div>
      </section>
    </div>
  </div>

  <!-- 再生モーダル -->
  <div id="modal">
    <div class="box">
      <div class="player" id="player"></div>
      <button class="btn close block" id="close">閉じる</button>
    </div>
  </div>

<script>
const CFG = window.SUMAKO_CONFIG;
const UNLOCK_KEY = "sumako_unlocked";

async function sha256(text) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

/* ===== ゲート ===== */
const gate = document.getElementById("gate");
const app = document.getElementById("app");
const passInput = document.getElementById("pass");
const gateError = document.getElementById("gate-error");

async function tryEnter() {
  const val = passInput.value.trim();
  if (!val) return;
  if (await sha256(val) === CFG.PASSPHRASE_HASH) {
    sessionStorage.setItem(UNLOCK_KEY, "1");
    openApp();
  } else {
    gateError.textContent = "合言葉が違います";
    passInput.value = ""; passInput.focus();
  }
}
document.getElementById("enter").addEventListener("click", tryEnter);
passInput.addEventListener("keydown", e => { if (e.key === "Enter") tryEnter(); });
document.getElementById("lock").addEventListener("click", () => {
  sessionStorage.removeItem(UNLOCK_KEY); location.reload();
});

function openApp() {
  gate.style.display = "none";
  app.classList.add("on");
  loadVideos();
  initNotes();
}
if (sessionStorage.getItem(UNLOCK_KEY) === "1") openApp();

/* ===== 大枠切り替え ===== */
document.querySelectorAll("aside .navbtn").forEach(b => {
  b.addEventListener("click", () => {
    document.querySelectorAll("aside .navbtn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    const v = b.dataset.view;
    document.getElementById("view-archive").classList.toggle("on", v === "archive");
    document.getElementById("view-notes").classList.toggle("on", v === "notes");
  });
});

/* ===== アーカイブ ===== */
let allVideos = [];
let currentPlayer = null;
let currentQuery = "";
const grid = document.getElementById("grid");
const emptyBox = document.getElementById("empty");
const countEl = document.getElementById("count");
const tabsEl = document.getElementById("tabs");

async function loadVideos() {
  try {
    const res = await fetch("videos.json?_=" + Date.now());
    allVideos = await res.json();
  } catch (e) { allVideos = []; }
  buildTabs();
  readHash();
  markActiveTab();
  applyFilters();
}

function buildTabs() {
  const counts = {};
  for (const v of allVideos) for (const p of (v.players || [])) counts[p] = (counts[p] || 0) + 1;
  const players = Object.keys(counts).sort((a, b) => counts[b] - counts[a] || a.localeCompare(b, "ja"));
  tabsEl.innerHTML = "";
  const mk = (label, key, n) => {
    const b = document.createElement("button");
    b.innerHTML = escapeHtml(label) + (n != null ? ` <span class="n">${n}</span>` : "");
    b.dataset.player = key === null ? "" : key;
    b.addEventListener("click", () => selectPlayer(key));
    tabsEl.appendChild(b);
  };
  mk("すべて", null, allVideos.length);
  for (const p of players) mk(p, p, counts[p]);
  tabsEl.style.display = players.length === 0 ? "none" : "flex";
}
function markActiveTab() {
  for (const b of tabsEl.querySelectorAll("button"))
    b.classList.toggle("active", (b.dataset.player || "") === (currentPlayer || ""));
}
function selectPlayer(p) {
  currentPlayer = p;
  location.hash = p ? "player=" + encodeURIComponent(p) : "";
  markActiveTab(); applyFilters();
}
function readHash() {
  const m = location.hash.match(/player=([^&]+)/);
  currentPlayer = m ? decodeURIComponent(m[1]) : null;
}
function applyFilters() {
  let list = allVideos;
  if (currentPlayer) list = list.filter(v => (v.players || []).includes(currentPlayer));
  if (currentQuery) list = list.filter(v => (v.title || "").toLowerCase().includes(currentQuery));
  render(list);
}
function render(list) {
  countEl.textContent = allVideos.length ? (list.length + " / " + allVideos.length + " 本") : "";
  grid.innerHTML = "";
  emptyBox.style.display = allVideos.length === 0 ? "block" : "none";
  for (const v of list) {
    const card = document.createElement("div");
    card.className = "card";
    const src = v.source === "twitch" ? "twitch" : "youtube";
    const label = src === "twitch" ? "Twitch" : "YouTube";
    const chips = (v.players || []).length
      ? `<div class="chips">${v.players.map(p => `<span class="chip">${escapeHtml(p)}</span>`).join("")}</div>` : "";
    card.innerHTML = `
      <div class="thumb">
        <span class="badge ${src}">${label}</span>
        <img loading="lazy" src="${escapeHtml(v.thumb || "")}" alt="">
        <div class="play"><span></span></div>
      </div>
      <div class="meta">
        <p class="title">${escapeHtml(v.title)}</p>
        <div class="sub">${escapeHtml(v.author || "")}${v.published ? " ・ " + v.published.slice(0,10) : ""}</div>
        ${chips}
      </div>`;
    card.addEventListener("click", () => play(v));
    grid.appendChild(card);
  }
}
document.getElementById("search").addEventListener("input", e => {
  currentQuery = e.target.value.trim().toLowerCase(); applyFilters();
});
window.addEventListener("hashchange", () => { readHash(); markActiveTab(); applyFilters(); });

/* ===== 再生モーダル ===== */
const modal = document.getElementById("modal");
const player = document.getElementById("player");
function play(v) {
  const src = v.source === "twitch"
    ? `https://player.twitch.tv/?video=${encodeURIComponent(v.id)}&parent=${location.hostname}&autoplay=true`
    : `https://www.youtube.com/embed/${encodeURIComponent(v.id)}?autoplay=1`;
  player.innerHTML = `<iframe src="${src}" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
  modal.style.display = "flex";
}
function closeModal() { modal.style.display = "none"; player.innerHTML = ""; }
document.getElementById("close").addEventListener("click", closeModal);
modal.addEventListener("click", e => { if (e.target === modal) closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

/* ===== メモ機能（localStorageに保存） ===== */
const NOTES_KEY = "sumako_notes_v1";
const CAT_TITLE = { tech: "各種技メモ", aware: "試合中の意識", combo: "コンボルート整理" };
let NOTES = { tech: [], aware: [], combo: [] };
let currentCat = "tech";
const notesList = document.getElementById("notes-list");
const notesEmpty = document.getElementById("notes-empty");

function loadNotesData() {
  try {
    const raw = localStorage.getItem(NOTES_KEY);
    if (raw) NOTES = Object.assign({ tech: [], aware: [], combo: [] }, JSON.parse(raw));
  } catch (e) { /* 読めなくても空で続行 */ }
}
function saveNotesData() {
  try { localStorage.setItem(NOTES_KEY, JSON.stringify(NOTES)); } catch (e) {}
}
function seedExamplesIfEmpty() {
  const empty = !NOTES.tech.length && !NOTES.aware.length && !NOTES.combo.length;
  if (!empty) return;
  if (localStorage.getItem(NOTES_KEY + "_seeded")) return;
  NOTES.tech.push({ id: Date.now(), title: "（例）上B・スーパージャンプパンチ", body: "復帰・暴れ・対空の要点をここに書く。" });
  NOTES.aware.push({ id: Date.now() + 1, title: "（例）着地狩り", body: "相手の着地パターンを意識。空Nで抑える等。" });
  NOTES.combo.push({ id: Date.now() + 2, title: "（例）下投げ始動", body: "下投げ → 上強 → 空上 …（%帯ごとに整理）" });
  try { localStorage.setItem(NOTES_KEY + "_seeded", "1"); } catch (e) {}
  saveNotesData();
}
function initNotes() {
  loadNotesData();
  seedExamplesIfEmpty();
  renderNotes();
}
function renderNotes() {
  document.getElementById("notes-title").textContent = CAT_TITLE[currentCat];
  const arr = NOTES[currentCat];
  notesList.innerHTML = "";
  notesEmpty.hidden = arr.length > 0;
  for (const note of arr) {
    const el = document.createElement("div");
    el.className = "note";
    el.innerHTML = `
      <input class="note-title" type="text" placeholder="タイトル（例：上B、崖狩り…）">
      <textarea placeholder="メモを書く…"></textarea>
      <div class="row"><button class="del">削除</button></div>`;
    const ti = el.querySelector(".note-title");
    const ta = el.querySelector("textarea");
    ti.value = note.title || "";
    ta.value = note.body || "";
    ti.addEventListener("input", () => { note.title = ti.value; saveNotesData(); });
    ta.addEventListener("input", () => { note.body = ta.value; saveNotesData(); });
    el.querySelector(".del").addEventListener("click", () => {
      if (!confirm("このノートを削除しますか？")) return;
      NOTES[currentCat] = NOTES[currentCat].filter(n => n.id !== note.id);
      saveNotesData(); renderNotes();
    });
    notesList.appendChild(el);
  }
}
document.querySelectorAll("#subtabs button").forEach(b => {
  b.addEventListener("click", () => {
    document.querySelectorAll("#subtabs button").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    currentCat = b.dataset.cat;
    renderNotes();
  });
});
document.getElementById("add-note").addEventListener("click", () => {
  NOTES[currentCat].unshift({ id: Date.now() + Math.random(), title: "", body: "" });
  saveNotesData(); renderNotes();
  const first = notesList.querySelector(".note-title");
  if (first) first.focus();
});
document.getElementById("export-notes").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(NOTES, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "sumako-notes.json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});
document.getElementById("import-notes").addEventListener("click", () => document.getElementById("import-file").click());
document.getElementById("import-file").addEventListener("change", e => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      NOTES = Object.assign({ tech: [], aware: [], combo: [] }, data);
      saveNotesData(); renderNotes();
      alert("読み込みました。");
    } catch (err) { alert("読み込みに失敗しました（JSON形式ではないようです）。"); }
  };
  r.readAsText(f);
  e.target.value = "";
});
</script>
