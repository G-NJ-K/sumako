name: 動画を自動収集

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python を用意
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 収集スクリプトを実行
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: python scripts/collect.py

      - name: 変更があればコミット
        run: |
          git config user.name "sumako-bot"
          git config user.email "actions@github.com"
          if [ -n "$(git status --porcelain videos.json)" ]; then
            git add videos.json
            git commit -m "自動更新: 動画アーカイブ"
            git push
          else
            echo "更新なし"
          fi
